<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <title>OTP Email</title>
    <!--[if mso]>
    <style type="text/css">
        body, table, td {font-family: Arial, sans-serif !important;}
        table {border-collapse: collapse !important;}
    </style>
    <![endif]-->
</head>
<body style="margin: 0; padding: 0; background-color: #ff5a6e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">

    <!-- Wrapper Table -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #ff5a6e;">
        <tr>
            <td align="center" style="padding: 40px 20px;">

                <!-- Main Container -->
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="max-width: 600px; width: 100%;">
                    <tr>
                        <td>

                            <!-- White Card Container -->
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #ffffff; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                                <tr>
                                    <td align="center" style="padding: 50px 30px;">

                                        <!-- Email Icon -->
                                        <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                                            <tr>
                                                <td align="center" style="padding-bottom: 30px;">
                                                    <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #ffd93d 0%, #f9ca24 100%); border-radius: 50%; display: inline-block; text-align: center; line-height: 80px;">
                                                        <span style="font-size: 40px; color: white; vertical-align: middle;">✉</span>
                                                    </div>
                                                </td>
                                            </tr>
                                        </table>

                                        <!-- Heading -->
                                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                            <tr>
                                                <td align="center" style="padding-bottom: 12px;">
                                                    <p style="margin: 0; font-size: 16px; color: #666666; line-height: 1.5;">
                                                        Hello <strong>{{NAME}}</strong>,
                                                    </p>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td align="center" style="padding-bottom: 8px;">
                                                    <h1 style="margin: 0; font-size: 24px; font-weight: 600; color: #1a1a1a; line-height: 1.3;">
                                                        Here is your One Time Password
                                                    </h1>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td align="center" style="padding-bottom: 30px;">
                                                    <p style="margin: 0; font-size: 14px; color: #666666; line-height: 1.5;">
                                                        to validate your email address
                                                    </p>
                                                </td>
                                            </tr>
                                        </table>

                                        <!-- OTP Code -->
                                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                            <tr>
                                                <td align="center" style="padding-bottom: 25px;">
                                                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="display: inline-table;">
                                                        <tr style="white-space: nowrap;">
                                                            {{OTP_BOXES}}
                                                        </tr>
                                                    </table>
                                                </td>
                                            </tr>
                                        </table>

                                        <!-- Expiry Message -->
                                        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                            <tr>
                                                <td align="center">
                                                    <p style="margin: 0; font-size: 14px; color: #333333; line-height: 1.5;">
                                                        OTP will expire in <strong style="font-weight: 600;">{{EXPIRY_MINUTES}} minutes</strong>.
                                                    </p>
                                                </td>
                                            </tr>
                                        </table>

                                    </td>
                                </tr>
                            </table>

                            <!-- Footer Links -->
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                <tr>
                                    <td align="center" style="padding-top: 30px;">
                                        <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                                            <tr>
                                                <td>
                                                    <a href="#" style="color: #ffffff; text-decoration: underline; font-size: 13px;">Privacy policy</a>
                                                </td>
                                                <td style="color: #ffffff; padding: 0 8px; font-size: 13px;">•</td>
                                                <td>
                                                    <a href="#" style="color: #ffffff; text-decoration: underline; font-size: 13px;">Terms of service</a>
                                                </td>
                                                <td style="color: #ffffff; padding: 0 8px; font-size: 13px;">•</td>
                                                <td>
                                                    <a href="#" style="color: #ffffff; text-decoration: underline; font-size: 13px;">Help center</a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>

</body>
</html>
